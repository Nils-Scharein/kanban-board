      - JENKINS_AGENT_SSH_PUBKEY=ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIxtfn/iOfiHCCd267F8IiMhVVGoST4lgEb9CZiZIBPi

  agent2:
    image: jenkins/ssh-agent:jdk21
    restart: unless-stopped
