    image: jenkins/jenkins:lts
    restart: unless-stopped
    ports:
      - "192.168.178.39:8081:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
  ssh-agent:
    image: jenkins/ssh-agent

  agent1:
    image: jenkins/ssh-agent:jdk21
    restart: unless-stopped
    container_name: agent1
