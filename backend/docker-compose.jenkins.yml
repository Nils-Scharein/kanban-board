services:
  jenkins:
    image: jenkins/jenkins:lts
    restart: unless-stopped
    ports:
      - "192.168.178.39:8081:8080"
    volumes:
      - jenkins_home:/var/jenkins_home

  agent1:
    build:
      context: .
      dockerfile: "./Dockerfile-agents"
      args:
        TARGETARCH: arm64
        DOCKER_GID: "984"
    restart: unless-stopped
    container_name: agent1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "984"
    environment:
      - JENKINS_AGENT_SSH_PUBKEY=ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIxtfn/iOfiHCCd267F8IiMhVVGoST4lgEb9CZiZIBPi

